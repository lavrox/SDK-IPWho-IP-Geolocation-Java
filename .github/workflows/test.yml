name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: ./gradlew --no-daemon test jar javadoc
      - name: The published dependency list is Jackson only
        run: |
          ./gradlew --no-daemon generatePomFileForMavenPublication
          pom=$(find build/publications -name pom-default.xml | head -1)
          cat "$pom"
          grep -q jackson-databind "$pom"
          ! grep -qi okhttp "$pom"
